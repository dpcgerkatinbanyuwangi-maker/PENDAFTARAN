<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran Kaos</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 sm:p-6 relative overflow-x-hidden">

    <!-- Background Glow Effect -->
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-full max-w-4xl h-96 bg-emerald-500/10 blur-[120px] rounded-full pointer-events-none"></div>

    <div class="w-full max-w-lg bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-2xl shadow-2xl p-6 sm:p-8 relative z-10 my-8">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 bg-emerald-500/10 border border-emerald-500/20 rounded-xl mb-3 text-emerald-400">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
                </svg>
            </div>
            <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white">Form Pendaftaran Kaos</h1>
            <p class="text-sm text-slate-400 mt-1">Lengkapi data di bawah ini untuk pemesanan kaos.</p>
        </div>

        <!-- Notification Banner -->
        <div id="statusAlert" class="hidden mb-6 p-4 rounded-xl text-sm font-medium border flex items-center gap-3 transition-all duration-300"></div>

        <!-- Form -->
        <form id="registrationForm" class="space-y-5">
            
            <!-- Nama Lengkap -->
            <div>
                <label for="nama" class="block text-xs font-semibold tracking-wider text-slate-300 uppercase mb-2">Nama Lengkap</label>
                <input type="text" id="nama" name="nama" required placeholder="Sesuai KTP"
                    class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 text-sm placeholder-slate-600 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all">
            </div>

            <!-- NIK KTP -->
            <div>
                <label for="nik" class="block text-xs font-semibold tracking-wider text-slate-300 uppercase mb-2">NIK KTP</label>
                <input type="text" id="nik" name="nik" required placeholder="16 Digit NIK" maxlength="16"
                    class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 text-sm placeholder-slate-600 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all">
            </div>

            <!-- Alamat -->
            <div>
                <label for="alamat" class="block text-xs font-semibold tracking-wider text-slate-300 uppercase mb-2">Alamat Pengiriman</label>
                <textarea id="alamat" name="alamat" rows="3" required placeholder="Jalan, RT/RW, Kecamatan, Kota/Kabupaten"
                    class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 text-sm placeholder-slate-600 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all"></textarea>
            </div>

            <!-- Grid Jenis Lengan & Ukuran -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="lengan" class="block text-xs font-semibold tracking-wider text-slate-300 uppercase mb-2">Jenis Lengan</label>
                    <select id="lengan" name="lengan" required
                        class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 text-sm focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all">
                        <option value="" disabled selected>Pilih Lengan</option>
                        <option value="Pendek">Lengan Pendek</option>
                        <option value="Panjang">Lengan Panjang</option>
                    </select>
                </div>

                <div>
                    <label for="ukuran" class="block text-xs font-semibold tracking-wider text-slate-300 uppercase mb-2">Ukuran Kaos</label>
                    <select id="ukuran" name="ukuran" required
                        class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 text-sm focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all">
                        <option value="" disabled selected>Pilih Ukuran</option>
                        <option value="S">S</option>
                        <option value="M">M</option>
                        <option value="L">L</option>
                        <option value="XL">XL</option>
                        <option value="XXL">XXL</option>
                    </select>
                </div>
            </div>

            <!-- Pembayaran -->
            <div>
                <label for="pembayaran" class="block text-xs font-semibold tracking-wider text-slate-300 uppercase mb-2">Metode Pembayaran</label>
                <select id="pembayaran" name="pembayaran" required
                    class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 text-sm focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all">
                    <option value="" disabled selected>Pilih Pembayaran</option>
                    <option value="Ditempat">Bayar di Tempat (COD)</option>
                    <option value="GoPay">GoPay (083122356065 a/n ABDULLAH)</option>
                </select>
                <div class="mt-2 p-3 bg-emerald-500/5 border border-emerald-500/10 rounded-lg text-xs text-slate-400">
                    💡 <strong class="text-emerald-400">Info GoPay:</strong> Transfer ke <span class="text-slate-200 font-mono">083122356065</span> a/n ABDULLAH.
                </div>
            </div>

            <!-- Bukti Pembayaran -->
            <div>
                <label for="bukti" class="block text-xs font-semibold tracking-wider text-slate-300 uppercase mb-2">Link Bukti Transfer / QR Code</label>
                <input type="url" id="bukti" name="bukti" required placeholder="https://drive.google.com/... atau link gambar"
                    class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 text-sm placeholder-slate-600 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all">
                <p class="text-[11px] text-slate-500 mt-1">Upload bukti ke Google Drive / Imgur / PostImages lalu paste linknya di sini.</p>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn"
                class="w-full mt-4 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3.5 px-6 rounded-xl transition-all duration-200 shadow-lg shadow-emerald-500/20 active:scale-[0.99] flex items-center justify-center gap-2">
                <span>Kirim Pendaftaran</span>
                <svg id="btnIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                </svg>
            </button>
        </form>

        <!-- Footer -->
        <div class="mt-8 pt-6 border-t border-slate-800/80 text-center">
            <p class="text-xs text-slate-500">Hosted with GitHub Pages • Form Auto-Sync to Google Sheets</p>
        </div>
    </div>

    <script>
        // MASUKKAN URL GOOGLE APPS SCRIPT ANDA DI SINI
        const scriptURL = 'https://script.google.com/macros/s/GANTI_DENGAN_URL_ANDA/exec';
        
        const form = document.getElementById('registrationForm');
        const submitBtn = document.getElementById('submitBtn');
        const alertBox = document.getElementById('statusAlert');

        form.addEventListener('submit', e => {
            e.preventDefault();
            
            // Set Loading State
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-75', 'cursor-not-allowed');
            submitBtn.innerHTML = `
                <svg class="animate-spin h-5 w-5 text-slate-950" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>Mengirim...</span>
            `;

            fetch(scriptURL, { method: 'POST', body: new FormData(form) })
                .then(response => {
                    showAlert('Pendaftaran berhasil terkirim! Data telah disimpan.', 'success');
                    form.reset();
                })
                .catch(error => {
                    showAlert('Gagal mengirim data. Pastikan koneksi internet lancar.', 'error');
                })
                .finally(() => {
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
                    submitBtn.innerHTML = `
                        <span>Kirim Pendaftaran</span>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                        </svg>
                    `;
                });
        });

        function showAlert(message, type) {
            alertBox.classList.remove('hidden', 'bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-400', 'bg-rose-500/10', 'border-rose-500/30', 'text-rose-400');
            
            if (type === 'success') {
                alertBox.classList.add('bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-400');
                alertBox.innerHTML = `
                    <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                    <span>${message}</span>
                `;
            } else {
                alertBox.classList.add('bg-rose-500/10', 'border-rose-500/30', 'text-rose-400');
                alertBox.innerHTML = `
                    <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                    <span>${message}</span>
                `;
            }
        }
    </script>
</body>
</html>
