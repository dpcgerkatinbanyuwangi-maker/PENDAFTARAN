<script>
  // MASUKKAN URL WEB APP YANG ANDA SALIN DARI LANGKAH 1 DI SINI
  const SCRIPT_URL = "PASANG_URL_WEB_APP_ANDA_DI_SINI";

  function togglePaymentInfo(method) {
    const gopayBox = document.getElementById('gopayInfoBox');
    if (method === 'gopay') {
      gopayBox.classList.remove('hidden');
    } else {
      gopayBox.classList.add('hidden');
    }
  }

  function copyGoPayNumber() {
    const num = document.getElementById('gopayNum').innerText;
    navigator.clipboard.writeText(num).then(() => {
      const btnText = document.getElementById('copyBtnText');
      btnText.innerText = 'Tersalin!';
      setTimeout(() => { btnText.innerText = 'Salin'; }, 2000);
    });
  }

  function previewImage(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('imagePreview').src = e.target.result;
        document.getElementById('uploadPlaceholder').classList.add('hidden');
        document.getElementById('previewContainer').classList.remove('hidden');
      }
      reader.readAsDataURL(file);
    }
  }

  function removeImage() {
    document.getElementById('bukti_transfer').value = '';
    document.getElementById('previewContainer').classList.add('hidden');
    document.getElementById('uploadPlaceholder').classList.remove('hidden');
  }

  async function handleSubmit(e) {
    e.preventDefault();
    
    const submitBtn = e.target.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    submitBtn.innerText = "Mengirim...";

    const dataPendaftaran = {
      nama: document.getElementById('nama').value,
      nik: document.getElementById('nik').value,
      alamat: document.getElementById('alamat').value,
      lengan: document.querySelector('input[name="jenis_lengan"]:checked')?.value || '-',
      ukuran: document.querySelector('input[name="ukuran"]:checked')?.value || '-',
      pembayaran: document.querySelector('input[name="pembayaran"]:checked')?.value || '-'
    };

    try {
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dataPendaftaran)
      });

      alert("✅ Pendaftaran Berhasil! Data Anda sudah tersimpan di Google Sheets.");
      e.target.reset();
      removeImage();
    } catch (error) {
      alert("❌ Terjadi kesalahan saat mengirim data. Silakan coba lagi.");
      console.error(error);
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerText = "Kirim Pendaftaran";
    }
  }
</script>
